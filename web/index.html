<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikClip Web — AI Video Clipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/supoclip.css?v=20261102_yt3">
</head>
<body>
  <div class="sc-layout">
    <!-- BARRA LATERAL (ESTILO SUPOCLIP) -->
    <aside class="sc-sidebar">
      <div class="sc-brand">
        <span class="sc-brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
          </svg>
        </span>
        <span class="sc-brand-text">TikClip</span>
      </div>

      <button class="sc-new-btn" id="btn-new-gen" title="Nova geração (Atalho: N)">
        <span>+ Nova geração</span>
        <kbd class="sc-kbd">N</kbd>
      </button>

      <nav class="sc-nav" id="sidebar-nav" aria-label="Menu principal">
        <button class="sc-nav-item is-active" data-view="criar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
          <span>Criar</span>
        </button>

        <button class="sc-nav-item" data-view="biblioteca">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>
          <span>Biblioteca</span>
        </button>

        <button class="sc-nav-item" data-view="publicador">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg>
          <span>Publicador TikTok</span>
          <span class="sc-badge-count" id="nav-acc-count">2</span>
        </button>

        <button class="sc-nav-item" data-view="youtube_publisher">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><polygon points="10 15 15 12 10 9 10 15"/></svg>
          <span>Publicador YouTube</span>
          <span class="sc-badge-count" id="nav-yt-acc-count" style="display:none">0</span>
        </button>

        <button class="sc-nav-item" data-view="canais">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><polygon points="10 15 15 12 10 9 10 15"/></svg>
          <span>Canais YouTube</span>
          <span class="sc-badge-count" id="nav-channels-count" style="display:none">0</span>
        </button>

        <button class="sc-nav-item" data-view="tiktok_downloads">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Vídeos do TikTok</span>
          <span class="sc-badge-count" id="nav-tiktok-count" style="display:none">0</span>
        </button>

        <button class="sc-nav-item" data-view="estudio">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect width="15" height="14" x="1" y="5" rx="2" ry="2"/></svg>
          <span>Estúdio IA</span>
        </button>

        <button class="sc-nav-item" data-view="agentes">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="8" rx="2"/><path d="M10 8V5c0-.6.4-1 1-1h2c.6 0 1 .4 1 1v3"/><path d="M8 14v.01"/><path d="M16 14v.01"/></svg>
          <span>Agentes e API</span>
        </button>

        <button class="sc-nav-item" data-view="configuracoes">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Configurações</span>
        </button>
      </nav>

      <button class="sc-search-btn" id="btn-open-search" title="Buscar projetos (Ctrl+K)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Buscar</span>
        <kbd class="sc-kbd-light">⌘K</kbd>
      </button>

      <div class="sc-sidebar-spacer"></div>

      <!-- Status Rápido de IA + Conta TikTok -->
      <div class="sc-sidebar-status">
        <div class="sc-status-row" id="sidebar-ai-pill" title="Clique para alternar entre Gemini e DeepSeek">
          <span class="sc-dot is-ok"></span>
          <span class="sc-status-label" id="sidebar-ai-label">IA: Carregando...</span>
        </div>
        <div class="sc-status-row" id="sidebar-tt-pill" title="Conta ativa do TikTok">
          <span class="sc-dot is-tt"></span>
          <span class="sc-status-label" id="sidebar-tt-label">TikTok: Conta Principal</span>
        </div>
      </div>

      <div class="sc-sidebar-footer">
        <button class="sc-footer-link" id="btn-theme-toggle" title="Alternar modo Claro / Escuro">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span id="theme-label">Modo escuro</span>
        </button>

        <div class="sc-user-card">
          <div class="sc-avatar">A</div>
          <div class="sc-user-info">
            <div class="sc-user-name">Admin</div>
            <div class="sc-user-email">TikClip Local Pro</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="sc-main" id="main-view" role="main"></main>
  </div>

  <!-- MODAL DE BUSCA RÁPIDA (CTRL+K) -->
  <div class="sc-modal-backdrop" id="search-modal" style="display:none">
    <div class="sc-modal">
      <div class="sc-search-modal-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-modal-input" placeholder="Buscar projetos, vídeos ou comandos..." autocomplete="off">
        <button class="sc-btn-ghost sc-btn-sm" id="btn-close-search">ESC</button>
      </div>
      <div class="sc-search-results" id="search-modal-results"></div>
    </div>
  </div>

  <!-- MODAL GENÉRICO (EDIÇÃO DE CORTE / MCP / ETC) -->
  <div class="sc-modal-backdrop" id="dialog-modal" style="display:none">
    <div class="sc-modal sc-modal-lg" id="dialog-modal-content"></div>
  </div>

  <!-- TOAST -->
  <div class="sc-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/supoclip.js?v=20261109_yt6"></script>
</body>
</html>
